<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Proyectos de AlexGettup</title>
  <meta name="description" content="Índice de los proyectos de AlexGettup.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238e2f23'/%3E%3Cpath d='M10 9h12M10 16h12M10 23h7' stroke='%23fff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f4efe6;
      --ink: #1f1b16;
      --muted: #6b6257;
      --rule: #d5ccbc;
      --accent: #8e2f23;
      --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #15130f;
        --ink: #ece5d8;
        --muted: #a2988a;
        --rule: #38322a;
        --accent: #e8957a;
      }
    }

    * { box-sizing: border-box; margin: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 44rem;
      margin-inline: auto;
      padding: clamp(3rem, 12vh, 7rem) 1.25rem 2rem;
      background: var(--paper);
      color: var(--ink);
      font: 1rem/1.55 var(--sans);
    }

    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

    .owner { color: var(--muted); font-size: .95rem; }

    h1 {
      margin-top: .25rem;
      font: 400 clamp(2.75rem, 11vw, 4.5rem)/1.05 var(--serif);
      letter-spacing: -.02em;
    }

    ol {
      list-style: none;
      padding: 0;
      margin-top: clamp(2.5rem, 8vh, 4.5rem);
      border-top: 1px solid var(--ink);
      counter-reset: project;
    }

    li {
      counter-increment: project;
      display: grid;
      grid-template-columns: 2.5rem 1fr auto;
      column-gap: .5rem;
      align-items: baseline;
      padding-block: 1.5rem;
      border-bottom: 1px solid var(--rule);
    }

    li::before {
      content: counter(project, decimal-leading-zero);
      color: var(--muted);
      font-size: .85rem;
      font-variant-numeric: tabular-nums;
    }

    h2 { font: 400 1.6rem/1.2 var(--serif); }

    h2 a { text-decoration: none; }
    h2 a::after { content: " \2192"; display: inline-block; margin-left: .15em; transition: transform .15s; }
    h2 a:hover { color: var(--accent); }
    h2 a:hover::after { transform: translateX(.2em); }

    li p { grid-column: 2 / -1; margin-top: .35rem; color: var(--muted); }

    .source { color: var(--muted); font-size: .85rem; }
    .source:hover { color: var(--accent); }

    footer { margin-top: auto; padding-top: 3rem; color: var(--muted); font-size: .85rem; }

    @media (max-width: 30rem) {
      li { grid-template-columns: 2rem 1fr auto; }
      h2 { font-size: 1.3rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      h2 a::after { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <p class="owner">AlexGettup</p>
    <h1>Proyectos</h1>
  </header>

  <main>
    <!-- Para añadir un proyecto, copia un <li> entero y cambia sus datos. La numeración es automática. -->
    <ol>
      <li>
        <h2><a href="/dnd/">Campañas de D&amp;D</a></h2>
        <a class="source" href="https://github.com/AlexGettup/dnd">Código</a>
        <p>Personajes, lugares y sesiones de Dungeons &amp; Dramas.</p>
      </li>
      <li>
        <h2><a href="/townsquare/">Plaza del pueblo y Grimorio</a></h2>
        <a class="source" href="https://github.com/AlexGettup/townsquare">Código</a>
        <p>Grimorio virtual no oficial para jugar a Blood on the Clocktower.</p>
      </li>
    </ol>
  </main>

  <footer>
    <a href="https://github.com/AlexGettup">GitHub</a>
  </footer>
</body>
</html>
